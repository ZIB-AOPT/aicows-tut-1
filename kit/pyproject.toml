[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiddengems-client"
version = "0.1.0"
description = "Hidden Gems Arena bot client: protocol, SDK and self-check"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
]

[tool.setuptools]
packages = ["hiddengems"]
