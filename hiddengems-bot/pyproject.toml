[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hiddengems-bot-kit"
version = "0.1.0"
description = "Client-side Hidden Gems bot kit: SDK, templates and rules, without the arena"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.3"]

[tool.setuptools.packages.find]
include = ["hiddengems*"]
